# PostgreSQL host-based authentication for the private Nominatim service.
#
# Project-owned and bind-mounted read-only over
# /etc/postgresql/16/main/pg_hba.conf by .ddev/docker-compose.nominatim.yaml.
# It carries no `#ddev-generated` marker, so DDEV will not rewrite it.
#
# It exists because the image offers no override mechanism for authentication
# rules at all -- no environment variable, and no script in /app so much as
# mentions pg_hba -- while the image's own file ends with
# `host all all 0.0.0.0/0 md5`. That rule is any role, any database, from any
# address, and `listen_addresses = '*'` made it reachable: a socket opens to
# nominatim:5432 from ddev-ppu-web. The role it would have admitted is a
# superuser. Editing the image's copy in place would work and would be silently
# reverted by the next container recreate, which is why this file is here
# instead.
#
# Every line below is retained from the image's own file, minus that last rule.
# Do not "tidy" them:
#
#  - `local ... peer` is load-bearing. The importer and the API both connect over
#    the Unix socket and present no password at all -- which is why rotating the
#    database credential mid-import could not interrupt the import. Removing peer
#    breaks the service.
#  - The loopback SCRAM lines are what make a credential test possible. With
#    `listen_addresses = 'localhost'` they still work, and they are how the
#    rotation is verified.
#  - The replication lines are loopback-only and cost nothing. Replication is
#    configured but idle (UPDATE_MODE=none); leaving them avoids a second edit if
#    a catch-up is ever run.
#
# LF line endings only. This file is authored on Windows, and a trailing CR
# becomes part of the last token -- `scram-sha-256\r` is not an authentication
# method, and PostgreSQL refuses to start rather than starting insecurely.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             postgres                                peer
local   all             all                                     peer
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
local   replication     all                                     peer
host    replication     all             127.0.0.1/32            scram-sha-256
host    replication     all             ::1/128                 scram-sha-256
