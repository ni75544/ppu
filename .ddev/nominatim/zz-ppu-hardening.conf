# Listener hardening for the private Nominatim service's PostgreSQL.
#
# Project-owned, bind-mounted read-only to
# /etc/postgresql/16/main/conf.d/zz-ppu-hardening.conf. No `#ddev-generated`
# marker, so DDEV will not rewrite it.
#
# INERT ON ITS OWN IN THIS IMAGE -- kept deliberately. postgresql.conf carries
# `include_dir = 'conf.d'` at line 817 but then pins `listen_addresses='*'` at line
# 828, after its own include, and PostgreSQL takes the last assignment. So a
# drop-in cannot win here: what actually forces the listener to loopback is
# pg-hardening-entrypoint.sh, which rewrites line 828 before the postmaster starts.
# This file stays because it is the declarative statement of intent, and if a
# future image tag stops pinning listen_addresses the drop-in becomes the effective
# setting and already says localhost.
#
# The `zz-` prefix in the mount target is still deliberate: within conf.d, files
# are read in filename order, and this must sort after postgres-tuning.conf, which
# the image's config.sh generates from the POSTGRES_* environment variables in
# .ddev/docker-compose.nominatim.yaml.
#
# Mount this as a FILE. Mounting the conf.d directory would hide
# postgres-tuning.conf and the import toggle the image copies in as
# postgres-import.conf, discarding every POSTGRES_* setting with no error.
#
# Defence in depth, not the primary control -- pg_hba.conf is. This is what makes
# a future regression in those rules unreachable: no listener, nothing to
# authenticate against. Nothing outside this container has ever connected over
# TCP; every observed backend used the Unix socket.
#
# 'localhost' rather than '' so loopback SCRAM keeps working, which is how the
# database credential is verified.
#
# A listener change needs a postmaster restart, not a reload, which is why the
# shim applies it at boot rather than to a running instance. Never edit this into a
# running import's PostgreSQL.
#
# LF line endings only; a trailing CR here is a syntax error at startup.
listen_addresses = 'localhost'
