# The order field the contact's name is written to.
#
# A courier booking needs a name to ask for at pickup, and Commerce has no native
# home for one that is not attached to a billing profile. Rather than fabricate a
# country to make a billing address persist, the dispatch checkout writes the name
# to this typed order field, which is exactly what the Field API is for. String,
# single value, length 255 — a name, not free text.
langcode: en
status: true
dependencies:
  module:
    - commerce_order
id: commerce_order.field_dispatch_contact_name
field_name: field_dispatch_contact_name
entity_type: commerce_order
type: string
settings:
  max_length: 255
  case_sensitive: false
  is_ascii: false
module: core
locked: false
cardinality: 1
translatable: true
indexes: {  }
persist_with_no_fields: false
custom_storage: false
