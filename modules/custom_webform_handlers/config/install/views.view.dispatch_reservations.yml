          1: AND
      # A truthful empty state. It has to distinguish two things an operator will
      # otherwise confuse: a day with no bookings, and a page that filtered
      # something out. This page never hides a row it fetched, so the only honest
      # reading of an empty table is that the ledger holds no matching row.
      empty:
        area_text_custom:
          id: area_text_custom
          table: views
          field: area_text_custom
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: text_custom
          empty: true
          tokenize: false
          content: 'No reservation matches these filters. This page reads the Dispatch reservation ledger directly and hides no row it fetched, so an empty table means the ledger holds nothing that matches — not that something was withheld.'
      header: {  }
      footer: {  }
      arguments: {  }
      relationships: {  }
      # No AJAX, so a filtered page has a URL somebody can bookmark or hand to a
      # colleague, and no operations depend on JavaScript being available.
      use_ajax: false
      group_by: false
      use_more: false
      use_more_always: true
      use_more_text: more
      link_display: '0'
      css_class: ''
      show_admin_links: true
      display_description: ''
      display_extenders: {  }
  page_1:
    id: page_1
    display_title: Page
    display_plugin: page
    position: 1
    display_options:
      # Nested inside the Dispatch Planner's own admin section, beside 'day', 'week'
