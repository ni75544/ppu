              default_sort_order: asc
              align: views-align-right
              separator: ''
              empty_column: false
              responsive: priority-low
            changed:
              sortable: true
              default_sort_order: desc
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
      row:
        type: fields
        options:
          default_field_elements: true
          inline: {  }
          separator: ''
          hide_empty: false
      # Every column below prints its own truthful empty text rather than a blank
      # cell, because on a ledger a blank is ambiguous: it could mean the value was
      # never recorded, or that this reader may not see it. A reader who may not see
      # a column does not get the column at all — the handler refuses in access()
      # and Views removes it before the query is built — so an empty cell here
      # always means the ledger has nothing to show.
      fields:
        dispatch_reservation_id:
          id: dispatch_reservation_id
          table: custom_webform_handlers_dispatch_reservation
          field: dispatch_reservation_id
          relationship: none
          group_type: group
          admin_label: ''
          plugin_id: dispatch_reservation_link
          label: ID
          exclude: false
          empty: ''
          hide_empty: false
          empty_zero: false
          hide_alter_empty: true
        state:
          id: state
          table: custom_webform_handlers_dispatch_reservation
          field: state
