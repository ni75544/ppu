# The read-only Reservation Dashboard.
#
# A listing of the Dispatch reservation ledger and nothing else. The ledger is the
# schedule authority, so this page reads the same rows the planner writes rather
# than reconstructing a schedule from Webform submissions: two answers to "what is
# booked" is the defect this view exists to avoid.
#
# It is deliberately a plain core Views page. Every rule that matters is enforced
# where it cannot be edited away — the columns Views may see at all are decided by
# custom_webform_handlers_views_data(), and whether a protected column is fetched at
# all is decided by the field handler's access() before the query is built. What is
# left here is presentation: which columns, in what order, sorted how.
#
# Three things about this file will not survive being re-saved through the Views UI,
# and are recorded here so that whoever does it knows what they lost:
#
# 1. Access is the module's own 'dispatch_board_audience' plugin, which grants the
#    page to either of the two permissions that already read the Dispatch board.
#    The UI's access form is a select of single permissions and cannot represent
#    "either"; re-saving there silently narrows the audience to whichever single
#    permission the select happens to show.
# 2. There is no export display, no bulk form, and no operations column, because
#    this dashboard may not offer a way to change or extract the ledger.
# 3. The four figures below carry the units they are stored in, and their titles say
#    so. Converting them to minutes and kilometres here would be a second copy of
#    arithmetic the Dispatch Planner board already owns.
#
# @see custom_webform_handlers_views_data()
# @see custom_webform_handlers_update_10038()
langcode: en
status: true
dependencies:
  # What Views recalculates for this view on save. `user` was carried over from an
  # earlier revision that used the core `perm` access plugin; the custom
  # `dispatch_board_audience` plugin that replaced it needs nothing from the user
  # module, and Views does not list itself.
  module:
    - custom_webform_handlers
id: dispatch_reservations
label: 'Reservation Dashboard'
module: views
description: 'Read-only listing of the authoritative Dispatch reservation ledger: Holds, confirmed Reservations, and the rows they became.'
tag: dispatch
base_table: custom_webform_handlers_dispatch_reservation
base_field: dispatch_reservation_id
display:
  default:
    id: default
    display_title: Default
    display_plugin: default
    position: 0
    display_options:
      title: 'Reservation Dashboard'
      # The Dispatch Planner board's own audience, and it has to be this plugin
      # rather than core's 'perm'. Core's holds one permission name, so the '+'
      # form the board's routes use — meaning "either" — would pass the route and
      # then fail the plugin's own render-time check for everybody except user 1,
      # leaving a titled page with no table on it.
      access:
        type: dispatch_board_audience
        options: {  }
      # No render cache. A Hold lapses against a wall clock and no ledger write
      # invalidates a cache tag, so a cached page could show capacity that has
      # already been released.
      cache:
        type: none
        options: {  }
      query:
        type: views_query
        options:
          query_comment: ''
          disable_sql_rewrite: false
          distinct: false
          replica: false
          query_tags: {  }
      exposed_form:
        type: basic
        options:
          submit_button: Filter
          reset_button: true
          reset_button_label: 'Show everything'
          exposed_sorts_label: 'Sort by'
          expose_sort_order: true
          sort_asc_label: Asc
          sort_desc_label: Desc
      # A staff pager: enough rows that a week of work is one page, with a page
      # count so nobody has to guess whether there is more.
      pager:
        type: full
        options:
          offset: 0
          items_per_page: 50
          total_pages: null
          id: 0
          tags:
            next: 'Next ›'
            previous: '‹ Previous'
            first: '« First'
            last: 'Last »'
          expose:
            items_per_page: false
            items_per_page_label: 'Items per page'
            items_per_page_options: '10, 25, 50, 100'
            items_per_page_options_all: false
            items_per_page_options_all_label: '- All -'
            offset: false
            offset_label: Offset
          quantity: 9
      style:
        type: table
        options:
          grouping: {  }
          row_class: ''
          default_row_class: true
          columns:
            dispatch_reservation_id: dispatch_reservation_id
            state: state
            pickup_arrival: pickup_arrival
            window_start: window_start
            resource_id: resource_id
            expires_at: expires_at
            customer_name: customer_name
            customer_phone: customer_phone
            customer_email: customer_email
            pickup_location: pickup_location
            delivery_location: delivery_location
            price_snapshot_cents: price_snapshot_cents
            order_id: order_id
            webform_id: webform_id
            submission_id: submission_id
            route_seconds: route_seconds
            route_meters: route_meters
            inbound_reposition_seconds: inbound_reposition_seconds
            outbound_reposition_seconds: outbound_reposition_seconds
            changed: changed
          # No default click-sort. The two sort handlers below decide the opening
          # order; naming a default here would replace them, and would drop the
          # identifier tie-break that makes the order stable.
          default: ''
          # Clicking a column heading replaces the default order rather than
          # refining it, which is core's behaviour and the one an operator expects
          # from a table heading.
          override: true
          sticky: true
          summary: ''
          empty_table: false
          caption: ''
          description: ''
          # 'responsive' is the only thing that makes a twenty-column ledger usable
          # on a phone: priority-low columns are dropped first, then priority-medium,
          # and the columns with no priority — what, when, and for whom — always
          # stay. Any priority class here makes Views attach core's tableresponsive
          # behaviour, which offers the hidden cells behind a per-row toggle.
          #
          # 'empty_column' is false throughout on purpose. A column that exists
          # should keep its heading even when every row in the current result is
          # empty, because "no route was measured on any of these jobs" is a fact an
          # operator should be able to read off the page.
          info:
            dispatch_reservation_id:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: ''
            state:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: ''
            pickup_arrival:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: ''
            window_start:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: ''
            resource_id:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-medium
            expires_at:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-medium
            customer_name:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-medium
            customer_phone:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            customer_email:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            pickup_location:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            delivery_location:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            price_snapshot_cents:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-medium
            order_id:
              sortable: false
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            webform_id:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            submission_id:
              sortable: true
              default_sort_order: asc
              align: ''
              separator: ''
              empty_column: false
              responsive: priority-low
            route_seconds:
              sortable: true
              default_sort_order: asc
              align: views-align-right
              separator: ''
              empty_column: false
              responsive: priority-low
            route_meters:
              sortable: true
              default_sort_order: asc
              align: views-align-right
              separator: ''
              empty_column: false
              responsive: priority-low
            inbound_reposition_seconds:
              sortable: true
              default_sort_order: asc
              align: views-align-right
              separator: ''
              empty_column: false
              responsive: priority-low
            outbound_reposition_seconds:
